<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chord — Web Synth</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #14161a;
    --panel: #1e2126;
    --accent: #6ee7c9;
    --accent-active: #3fd8ac;
    --text: #e8eaed;
    --muted: #8a8f98;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 50% 20%, #23262c, var(--bg) 70%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--text);
  }
  .synth {
    background: var(--panel);
    border-radius: 24px;
    padding: 40px 48px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.04);
    text-align: center;
  }
  h1 {
    margin: 0 0 4px;
    font-size: 20px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }
  p.sub {
    margin: 0 0 32px;
    color: var(--muted);
    font-size: 13px;
  }
  #tone-btn {
    width: 160px;
    height: 160px;
    border-radius: 50%;
    border: none;
    background: linear-gradient(145deg, #2a2e35, #1a1c20);
    box-shadow: 0 8px 20px rgba(0,0,0,0.4), inset 0 1px 2px rgba(255,255,255,0.06);
    color: var(--accent);
    font-size: 16px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    cursor: pointer;
    transition: transform 0.06s ease, box-shadow 0.06s ease, color 0.06s ease;
    user-select: none;
    -webkit-user-select: none;
  }
  #tone-btn:hover {
    color: var(--accent-active);
  }
  #tone-btn:active,
  #tone-btn.active {
    transform: scale(0.96);
    box-shadow: 0 4px 10px rgba(0,0,0,0.4), inset 0 2px 4px rgba(0,0,0,0.5), 0 0 24px rgba(110,231,201,0.35);
  }

  .keyboard {
    position: relative;
    display: flex;
    margin: 36px 0 8px;
    height: 160px;
    width: 336px;
  }
  .key {
    position: relative;
    border: 1px solid #0c0d0f;
    border-radius: 0 0 6px 6px;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    padding-bottom: 10px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.03em;
  }
  .key.white {
    position: relative;
    width: 48px;
    height: 160px;
    background: linear-gradient(180deg, #f4f4f4, #e2e2e2);
    color: #666;
    box-shadow: inset 0 -3px 4px rgba(0,0,0,0.08);
    z-index: 1;
  }
  .key.white.active {
    background: linear-gradient(180deg, var(--accent), #4fcfaa);
    color: #10221c;
  }
  .key.black {
    position: absolute;
    top: 0;
    width: 30px;
    height: 98px;
    background: linear-gradient(180deg, #333, #0f0f0f);
    color: #999;
    border-radius: 0 0 4px 4px;
    z-index: 2;
    padding-bottom: 8px;
    font-size: 10px;
  }
  .key.black.active {
    background: linear-gradient(180deg, var(--accent-active), #2aa886);
    color: #062015;
  }
</style>
</head>
<body>
  <div class="synth">
    <h1>Chord</h1>
    <p class="sub">press &amp; hold for tone</p>
    <button id="tone-btn">Play</button>

    <div class="keyboard" id="keyboard"></div>
  </div>

<script>
  const AudioCtx = window.AudioContext || window.webkitAudioContext;
  let audioCtx = null;

  function ensureContext() {
    if (!audioCtx) audioCtx = new AudioCtx();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  }

  const ATTACK = 0.01;
  const RELEASE = 0.08;
  const GAIN = 0.3;

  // active voices, keyed by an arbitrary id (note name or 'btn')
  const voices = new Map();

  function startVoice(id, freq) {
    ensureContext();
    if (voices.has(id)) return;

    const osc = audioCtx.createOscillator();
    const gainNode = audioCtx.createGain();

    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

    gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
    gainNode.gain.linearRampToValueAtTime(GAIN, audioCtx.currentTime + ATTACK);

    osc.connect(gainNode);
    gainNode.connect(audioCtx.destination);
    osc.start();

    voices.set(id, { osc, gainNode });
  }

  function stopVoice(id) {
    const voice = voices.get(id);
    if (!voice) return;
    const { osc, gainNode } = voice;
    const now = audioCtx.currentTime;
    gainNode.gain.cancelScheduledValues(now);
    gainNode.gain.setValueAtTime(gainNode.gain.value, now);
    gainNode.gain.linearRampToValueAtTime(0, now + RELEASE);
    osc.stop(now + RELEASE + 0.02);

    voices.delete(id);
  }

  // --- single tone button ---
  const FREQ_C4 = 261.63;
  const btn = document.getElementById('tone-btn');

  btn.addEventListener('mousedown', () => { startVoice('btn', FREQ_C4); btn.classList.add('active'); });
  btn.addEventListener('mouseup', () => { stopVoice('btn'); btn.classList.remove('active'); });
  btn.addEventListener('mouseleave', () => { stopVoice('btn'); btn.classList.remove('active'); });

  btn.addEventListener('touchstart', (e) => { e.preventDefault(); startVoice('btn', FREQ_C4); btn.classList.add('active'); }, { passive: false });
  btn.addEventListener('touchend', (e) => { e.preventDefault(); stopVoice('btn'); btn.classList.remove('active'); }, { passive: false });
  btn.addEventListener('touchcancel', (e) => { e.preventDefault(); stopVoice('btn'); btn.classList.remove('active'); }, { passive: false });

  // --- single-octave keyboard: 'a' = middle C (C4), 'w' = C#4 ---
  // Standard piano-style row mapping.
  const NOTE_MAP = [
    { key: 'a', note: 'C4',  semitone: 0,  type: 'white' },
    { key: 'w', note: 'C#4', semitone: 1,  type: 'black' },
    { key: 's', note: 'D4',  semitone: 2,  type: 'white' },
    { key: 'e', note: 'D#4', semitone: 3,  type: 'black' },
    { key: 'd', note: 'E4',  semitone: 4,  type: 'white' },
    { key: 'f', note: 'F4',  semitone: 5,  type: 'white' },
    { key: 't', note: 'F#4', semitone: 6,  type: 'black' },
    { key: 'g', note: 'G4',  semitone: 7,  type: 'white' },
    { key: 'y', note: 'G#4', semitone: 8,  type: 'black' },
    { key: 'h', note: 'A4',  semitone: 9,  type: 'white' },
    { key: 'u', note: 'A#4', semitone: 10, type: 'black' },
    { key: 'j', note: 'B4',  semitone: 11, type: 'white' },
    { key: 'k', note: 'C5',  semitone: 12, type: 'white' },
  ];

  function noteFreq(semitonesFromC4) {
    return FREQ_C4 * Math.pow(2, semitonesFromC4 / 12);
  }

  const keyByChar = new Map(NOTE_MAP.map(n => [n.key, n]));
  const heldKeys = new Set();

  // --- render keyboard UI ---
  const keyboardEl = document.getElementById('keyboard');
  const whiteKeys = NOTE_MAP.filter(n => n.type === 'white');
  const blackKeys = NOTE_MAP.filter(n => n.type === 'black');
  const WHITE_KEY_WIDTH = 48;

  whiteKeys.forEach(n => {
    const el = document.createElement('div');
    el.className = 'key white';
    el.dataset.key = n.key;
    el.textContent = n.key;
    keyboardEl.appendChild(el);
    n.el = el;
  });

  // black key horizontal offsets, indexed by which white key they sit between
  const blackOffsetByNote = {
    'C#4': 1, 'D#4': 2, 'F#4': 4, 'G#4': 5, 'A#4': 6,
  };
  blackKeys.forEach(n => {
    const el = document.createElement('div');
    el.className = 'key black';
    el.dataset.key = n.key;
    el.textContent = n.key;
    const whiteIndex = blackOffsetByNote[n.note];
    el.style.left = `${whiteIndex * WHITE_KEY_WIDTH - 15}px`;
    keyboardEl.appendChild(el);
    n.el = el;
  });

  function pressNote(n) {
    if (heldKeys.has(n.key)) return;
    heldKeys.add(n.key);
    startVoice(n.key, noteFreq(n.semitone));
    n.el.classList.add('active');
  }

  function releaseNote(n) {
    if (!heldKeys.has(n.key)) return;
    heldKeys.delete(n.key);
    stopVoice(n.key);
    n.el.classList.remove('active');
  }

  // mouse/touch interaction directly on keyboard keys
  NOTE_MAP.forEach(n => {
    n.el.addEventListener('mousedown', () => pressNote(n));
    n.el.addEventListener('mouseup', () => releaseNote(n));
    n.el.addEventListener('mouseleave', () => releaseNote(n));
    n.el.addEventListener('touchstart', (e) => { e.preventDefault(); pressNote(n); }, { passive: false });
    n.el.addEventListener('touchend', (e) => { e.preventDefault(); releaseNote(n); }, { passive: false });
    n.el.addEventListener('touchcancel', (e) => { e.preventDefault(); releaseNote(n); }, { passive: false });
  });

  // physical computer-keyboard interaction
  window.addEventListener('keydown', (e) => {
    if (e.repeat) return;
    const n = keyByChar.get(e.key.toLowerCase());
    if (!n) return;
    pressNote(n);
  });

  window.addEventListener('keyup', (e) => {
    const n = keyByChar.get(e.key.toLowerCase());
    if (!n) return;
    releaseNote(n);
  });
</script>
</body>
</html>
