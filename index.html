<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chord — Web Synth</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #14161a;
    --panel: #1e2126;
    --accent: #6ee7c9;
    --accent-active: #3fd8ac;
    --text: #e8eaed;
    --muted: #8a8f98;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 50% 20%, #23262c, var(--bg) 70%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--text);
  }
  .synth {
    background: var(--panel);
    border-radius: 24px;
    padding: 40px 48px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.04);
    text-align: center;
  }
  h1 {
    margin: 0 0 4px;
    font-size: 20px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }
  p.sub {
    margin: 0 0 32px;
    color: var(--muted);
    font-size: 13px;
  }
  .joystick {
    width: 220px;
    height: 220px;
    margin: 8px auto 0;
    user-select: none;
    -webkit-user-select: none;
  }
  .joy-wedge {
    cursor: pointer;
    fill: #22252a;
    stroke: #0c0d0f;
    stroke-width: 1;
    transition: fill 0.1s ease;
  }
  .joy-wedge:hover,
  .joy-wedge.active {
    fill: var(--accent-active);
  }
  .joy-label {
    font-size: 8.5px;
    font-weight: 700;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    fill: var(--muted);
    pointer-events: none;
    transition: fill 0.1s ease;
  }
  .joy-wedge:hover + .joy-label,
  .joy-label.active {
    fill: #0d1f19;
  }
  .joy-center {
    fill: url(#centerGradient);
    stroke: rgba(255,255,255,0.08);
    stroke-width: 1;
    cursor: pointer;
  }
  .joy-center-label {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    fill: var(--accent);
    text-anchor: middle;
    dominant-baseline: middle;
    pointer-events: none;
  }

  .key-selector {
    display: flex;
    gap: 4px;
    margin: 28px 0 0;
    justify-content: center;
    flex-wrap: wrap;
  }
  .key-btn {
    width: 30px;
    height: 30px;
    border-radius: 8px;
    border: none;
    background: #22252a;
    color: var(--muted);
    font-size: 10px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    transition: background 0.1s ease, color 0.1s ease;
  }
  .key-btn:hover {
    background: #2c3038;
    color: var(--text);
  }
  .key-btn.active {
    background: var(--accent);
    color: #0d1f19;
  }

  .chord-buttons {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin: 20px 0 8px;
    align-items: center;
  }
  .chord-row {
    display: flex;
    gap: 10px;
    justify-content: center;
  }
  .chord-btn {
    width: 64px;
    height: 88px;
    border-radius: 12px;
    border: none;
    background: linear-gradient(180deg, #2a2e35, #1a1c20);
    box-shadow: 0 4px 10px rgba(0,0,0,0.4), inset 0 1px 2px rgba(255,255,255,0.06);
    color: var(--text);
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    font-family: inherit;
    transition: transform 0.06s ease, box-shadow 0.06s ease, background 0.06s ease;
  }
  .chord-btn .degree {
    font-size: 18px;
    font-weight: 700;
  }
  .chord-btn .quality {
    font-size: 9px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .chord-btn .bind-key {
    font-size: 9px;
    font-weight: 600;
    color: var(--muted);
    opacity: 0.6;
    text-transform: lowercase;
  }
  .chord-btn:active,
  .chord-btn.active {
    transform: scale(0.96);
    background: linear-gradient(180deg, var(--accent), #3fd8ac);
    box-shadow: 0 2px 6px rgba(0,0,0,0.4), inset 0 2px 4px rgba(0,0,0,0.3), 0 0 18px rgba(110,231,201,0.35);
    color: #0d1f19;
  }
  .chord-btn.active .quality {
    color: #143d31;
  }
</style>
</head>
<body>
  <div class="synth">
    <h1>Chord</h1>
    <p class="sub">press &amp; hold for tone</p>

    <svg class="joystick" id="joystick" viewBox="0 0 220 220">
      <defs>
        <radialGradient id="centerGradient" cx="35%" cy="30%" r="75%">
          <stop offset="0%" stop-color="#3a3f47" />
          <stop offset="100%" stop-color="#22252a" />
        </radialGradient>
      </defs>

      <path class="joy-wedge" data-dir="up" d="M 94.69 73.04 L 71.73 17.61 A 100 100 0 0 1 148.27 17.61 L 125.31 73.04 A 40 40 0 0 0 94.69 73.04 Z" />
      <path class="joy-wedge" data-dir="up-right" d="M 125.31 73.04 L 148.27 17.61 A 100 100 0 0 1 202.39 71.73 L 146.96 94.69 A 40 40 0 0 0 125.31 73.04 Z" />
      <path class="joy-wedge" data-dir="right" d="M 146.96 94.69 L 202.39 71.73 A 100 100 0 0 1 202.39 148.27 L 146.96 125.31 A 40 40 0 0 0 146.96 94.69 Z" />
      <path class="joy-wedge" data-dir="down-right" d="M 146.96 125.31 L 202.39 148.27 A 100 100 0 0 1 148.27 202.39 L 125.31 146.96 A 40 40 0 0 0 146.96 125.31 Z" />
      <path class="joy-wedge" data-dir="down" d="M 125.31 146.96 L 148.27 202.39 A 100 100 0 0 1 71.73 202.39 L 94.69 146.96 A 40 40 0 0 0 125.31 146.96 Z" />
      <path class="joy-wedge" data-dir="down-left" d="M 94.69 146.96 L 71.73 202.39 A 100 100 0 0 1 17.61 148.27 L 73.04 125.31 A 40 40 0 0 0 94.69 146.96 Z" />
      <path class="joy-wedge" data-dir="left" d="M 73.04 125.31 L 17.61 148.27 A 100 100 0 0 1 17.61 71.73 L 73.04 94.69 A 40 40 0 0 0 73.04 125.31 Z" />
      <path class="joy-wedge" data-dir="up-left" d="M 73.04 94.69 L 17.61 71.73 A 100 100 0 0 1 71.73 17.61 L 94.69 73.04 A 40 40 0 0 0 73.04 94.69 Z" />

      <text class="joy-label" data-dir="up" x="110.0" y="32.0" text-anchor="middle">maj/min</text>
      <text class="joy-label" data-dir="up-right" x="165.2" y="54.8" text-anchor="middle">dom7</text>
      <text class="joy-label" data-dir="right" x="188.0" y="110.0" text-anchor="middle">7th</text>
      <text class="joy-label" data-dir="down-right" x="165.2" y="165.2" text-anchor="middle">9th</text>
      <text class="joy-label" data-dir="down" x="110.0" y="188.0" text-anchor="middle">sus4</text>
      <text class="joy-label" data-dir="down-left" x="54.8" y="165.2" text-anchor="middle">6/sus2</text>
      <text class="joy-label" data-dir="left" x="32.0" y="110.0" text-anchor="middle">dark</text>
      <text class="joy-label" data-dir="up-left" x="54.8" y="54.8" text-anchor="middle">aug</text>

      <circle class="joy-center" cx="110" cy="110" r="40" />
      <text class="joy-center-label" id="joy-center" x="110" y="110"></text>
    </svg>

    <div class="chord-buttons" id="chord-buttons"></div>

    <div class="key-selector" id="key-selector"></div>
  </div>

<script>
  const AudioCtx = window.AudioContext || window.webkitAudioContext;
  let audioCtx = null;

  function ensureContext() {
    if (!audioCtx) audioCtx = new AudioCtx();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  }

  const ATTACK = 0.1;
  const RELEASE = 0.08;
  const GAIN = 0.15;

  // active voices, keyed by an arbitrary id (note name or 'btn')
  const voices = new Map();

  function startVoice(id, freq) {
    ensureContext();
    if (voices.has(id)) return;

    const osc = audioCtx.createOscillator();
    const gainNode = audioCtx.createGain();

    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

    gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
    gainNode.gain.linearRampToValueAtTime(GAIN, audioCtx.currentTime + ATTACK);

    osc.connect(gainNode);
    gainNode.connect(audioCtx.destination);
    osc.start();

    voices.set(id, { osc, gainNode });
  }

  function stopVoice(id) {
    const voice = voices.get(id);
    if (!voice) return;
    const { osc, gainNode } = voice;
    const now = audioCtx.currentTime;
    gainNode.gain.cancelScheduledValues(now);
    gainNode.gain.setValueAtTime(gainNode.gain.value, now);
    gainNode.gain.linearRampToValueAtTime(0, now + RELEASE);
    osc.stop(now + RELEASE + 0.02);

    voices.delete(id);
  }

  const FREQ_C4 = 261.63;

  function noteFreq(semitonesFromC4) {
    return FREQ_C4 * Math.pow(2, semitonesFromC4 / 12);
  }

  // --- 7 diatonic chord buttons (key of C major) ---
  // Each button is a scale degree with its own natural triad quality, per
  // the HiChord manual's chord system: I ii iii IV V vi vii°.
  // 'key' is a stable identifier for each degree; 'bindKey' is the physical
  // computer-keyboard key that plays it. Odd degrees map to a-s-d-f, even to w-e-r.
  const DEGREES = [
    { degree: 'I',    key: '1', bindKey: 'a', semitone: 0,  quality: 'major' },
    { degree: 'ii',   key: '2', bindKey: 'w', semitone: 2,  quality: 'minor' },
    { degree: 'iii',  key: '3', bindKey: 's', semitone: 4,  quality: 'minor' },
    { degree: 'IV',   key: '4', bindKey: 'e', semitone: 5,  quality: 'major' },
    { degree: 'V',    key: '5', bindKey: 'd', semitone: 7,  quality: 'major' },
    { degree: 'vi',   key: '6', bindKey: 'r', semitone: 9,  quality: 'minor' },
    { degree: 'vii°', key: '7', bindKey: 'f', semitone: 11, quality: 'diminished' },
  ];

  // Natural triad intervals for each base quality.
  const BASE_TRIAD = {
    major: [0, 4, 7],
    minor: [0, 3, 7],
    diminished: [0, 3, 6],
  };

  // Joystick modification, applied relative to a button's own natural triad
  // quality (not always a major base). 'third'/'fifth' are computed from the
  // held button's BASE_TRIAD so e.g. holding a minor button and pushing
  // 'right' (7th) yields a minor 7th, not a major 7th.
  function getChordIntervals(quality, direction) {
    const [root, third, fifth] = BASE_TRIAD[quality];
    switch (direction) {
      case 'center':       return [root, third, fifth];
      case 'up':            // maj/min toggle
        return quality === 'major' ? BASE_TRIAD.minor : BASE_TRIAD.major;
      case 'up-right':      // dominant 7th (flattened 7th)
        return [root, third, fifth, 10];
      case 'right':         // natural 7th (major or minor, matching quality)
        return [root, third, fifth, quality === 'major' ? 11 : 10];
      case 'down-right':    // add9
        return [root, third, fifth, 14];
      case 'down':          // sus4
        return [root, 5, fifth];
      case 'down-left':     // add6, or sus2 if the triad has no major 3rd
        return quality === 'major' ? [root, third, fifth, 9] : [root, 2, fifth];
      case 'left':          // darken: flatten the 5th
        return [root, third, fifth - 1];
      case 'up-left':       // augmented: raise the 5th
        return [root, third, fifth + 1];
      default:
        return [root, third, fifth];
    }
  }

  const CHORD_LABELS = {
    center: null, up: 'maj/min', 'up-right': 'dom7', right: '7th',
    'down-right': 'add9', down: 'sus4', 'down-left': '6/sus2',
    left: 'dark', 'up-left': 'aug',
  };
  let currentDirection = 'center';

  // Global key: semitone offset from C. All 7 buttons transpose together,
  // per the manual: "the relationships between buttons stay the same —
  // only the pitch changes."
  const KEY_NAMES = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
  let currentKeyRoot = 0;

  const degreeByKey = new Map(DEGREES.map(d => [d.key, d]));
  const degreeByBindKey = new Map(DEGREES.map(d => [d.bindKey, d]));
  const heldDegrees = new Map(); // degree key -> direction used when pressed

  // --- render the 7 chord buttons: even-numbered on a top row of 3, odd on a bottom row of 4 ---
  const buttonsEl = document.getElementById('chord-buttons');
  const topRowEl = document.createElement('div');
  topRowEl.className = 'chord-row';
  const bottomRowEl = document.createElement('div');
  bottomRowEl.className = 'chord-row';
  buttonsEl.appendChild(topRowEl);
  buttonsEl.appendChild(bottomRowEl);

  DEGREES.forEach(d => {
    const el = document.createElement('button');
    el.className = 'chord-btn';
    el.dataset.key = d.key;
    el.innerHTML = `<span class="degree">${d.degree}</span><span class="quality">${d.quality === 'diminished' ? 'dim' : d.quality}</span><span class="bind-key">${d.bindKey} / ${d.key}</span>`;
    const isEven = Number(d.key) % 2 === 0;
    (isEven ? topRowEl : bottomRowEl).appendChild(el);
    d.el = el;
  });

  // --- render the 12-key key selector ---
  const keySelectorEl = document.getElementById('key-selector');
  const keyButtonEls = KEY_NAMES.map((name, root) => {
    const el = document.createElement('button');
    el.className = 'key-btn' + (root === currentKeyRoot ? ' active' : '');
    el.textContent = name;
    el.addEventListener('click', () => {
      setKeyRoot(root);
      keyButtonEls.forEach(btn => btn.classList.toggle('active', btn === el));
    });
    keySelectorEl.appendChild(el);
    return el;
  });

  function pressDegree(d) {
    if (heldDegrees.has(d.key)) return;
    heldDegrees.set(d.key, currentDirection);
    getChordIntervals(d.quality, currentDirection).forEach(interval => {
      startVoice(`${d.key}:${interval}`, noteFreq(currentKeyRoot + d.semitone + interval));
    });
    d.el.classList.add('active');
    updateJoyCenterLabel();
  }

  function releaseDegree(d) {
    if (!heldDegrees.has(d.key)) return;
    const direction = heldDegrees.get(d.key);
    heldDegrees.delete(d.key);
    getChordIntervals(d.quality, direction).forEach(interval => {
      stopVoice(`${d.key}:${interval}`);
    });
    d.el.classList.remove('active');
    updateJoyCenterLabel();
  }

  function setDirection(direction) {
    if (direction === currentDirection) return;
    const previousDirection = currentDirection;
    currentDirection = direction;

    // live-retune any buttons currently held: swap out old interval voices for the new direction
    heldDegrees.forEach((heldDirection, key) => {
      if (heldDirection === previousDirection) {
        const d = degreeByKey.get(key);
        getChordIntervals(d.quality, previousDirection).forEach(interval => stopVoice(`${key}:${interval}`));
        getChordIntervals(d.quality, direction).forEach(interval => {
          startVoice(`${key}:${interval}`, noteFreq(currentKeyRoot + d.semitone + interval));
        });
        heldDegrees.set(key, direction);
      }
    });
  }

  // Changing key while chords are held retunes them live, the same way the
  // joystick direction does, so switching key mid-chord doesn't cut the sound.
  function setKeyRoot(root) {
    if (root === currentKeyRoot) return;
    const previousRoot = currentKeyRoot;
    currentKeyRoot = root;

    heldDegrees.forEach((direction, key) => {
      const d = degreeByKey.get(key);
      getChordIntervals(d.quality, direction).forEach(interval => stopVoice(`${key}:${interval}`));
      getChordIntervals(d.quality, direction).forEach(interval => {
        startVoice(`${key}:${interval}`, noteFreq(currentKeyRoot + d.semitone + interval));
      });
    });
  }

  // mouse/touch interaction on the chord buttons: hovering plays the chord,
  // moving off stops it (touch has no hover concept, so it still uses press/release)
  DEGREES.forEach(d => {
    d.el.addEventListener('mouseenter', () => pressDegree(d));
    d.el.addEventListener('mouseleave', () => releaseDegree(d));
    d.el.addEventListener('touchstart', (e) => { e.preventDefault(); pressDegree(d); }, { passive: false });
    d.el.addEventListener('touchend', (e) => { e.preventDefault(); releaseDegree(d); }, { passive: false });
    d.el.addEventListener('touchcancel', (e) => { e.preventDefault(); releaseDegree(d); }, { passive: false });
  });

  // physical computer-keyboard interaction: odd degrees on a-s-d-f, even on
  // w-e-r, plus the number row 1-7 as an alternate binding for the same degrees
  window.addEventListener('keydown', (e) => {
    if (e.repeat) return;
    const d = degreeByBindKey.get(e.key.toLowerCase()) || degreeByKey.get(e.key);
    if (!d) return;
    pressDegree(d);
  });

  window.addEventListener('keyup', (e) => {
    const d = degreeByBindKey.get(e.key.toLowerCase()) || degreeByKey.get(e.key);
    if (!d) return;
    releaseDegree(d);
  });

  // --- joystick: hover a wedge to modify the held chord; leaving the pad snaps back to the natural triad ---
  const joystickEl = document.getElementById('joystick');
  const joyCenterEl = document.getElementById('joy-center');
  const joyWedges = document.querySelectorAll('.joy-wedge');
  const joyLabels = document.querySelectorAll('.joy-label');

  function setJoyDirection(dir) {
    setDirection(dir);
    joyWedges.forEach(w => w.classList.toggle('active', w.dataset.dir === dir));
    joyLabels.forEach(l => l.classList.toggle('active', l.dataset.dir === dir));
    updateJoyCenterLabel();
  }

  // At center, show the natural quality of whatever's currently held (so it's
  // clear the chord "snapped back" rather than looking blank/stuck); any other
  // direction shows that modification's label regardless of what's held.
  function updateJoyCenterLabel() {
    if (currentDirection !== 'center') {
      joyCenterEl.textContent = CHORD_LABELS[currentDirection] || '';
      return;
    }
    const heldQualities = new Set(
      Array.from(heldDegrees.keys()).map(key => degreeByKey.get(key).quality)
    );
    if (heldQualities.size === 1) {
      const [quality] = heldQualities;
      joyCenterEl.textContent = quality === 'diminished' ? 'dim' : quality;
    } else {
      joyCenterEl.textContent = '';
    }
  }

  const joyCenterCircle = document.querySelector('.joy-center');

  joyWedges.forEach(wedge => {
    wedge.addEventListener('mouseenter', () => setJoyDirection(wedge.dataset.dir));
  });

  // The center circle sits flush against the inner edge of all 8 wedges, so
  // moving the pointer from a wedge straight into the circle never crosses
  // the SVG's own boundary (no 'mouseleave' on the whole joystick fires).
  // It needs its own explicit hover handler to reset to center.
  joyCenterCircle.addEventListener('mouseenter', () => setJoyDirection('center'));

  joystickEl.addEventListener('mouseleave', () => setJoyDirection('center'));
</script>
</body>
</html>
