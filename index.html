<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chord — Web Synth</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #14161a;
    --panel: #1e2126;
    --accent: #6ee7c9;
    --accent-active: #3fd8ac;
    --text: #e8eaed;
    --muted: #8a8f98;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 50% 20%, #23262c, var(--bg) 70%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--text);
  }
  .synth {
    background: var(--panel);
    border-radius: 24px;
    padding: 40px 48px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.04);
    text-align: center;
  }
  h1 {
    margin: 0 0 4px;
    font-size: 20px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }
  p.sub {
    margin: 0 0 32px;
    color: var(--muted);
    font-size: 13px;
  }
  .joystick {
    position: relative;
    width: 180px;
    height: 180px;
    margin: 8px auto 0;
    border-radius: 50%;
    background: radial-gradient(circle at 50% 40%, #2a2e35, #16181c 75%);
    box-shadow: 0 8px 20px rgba(0,0,0,0.4), inset 0 1px 2px rgba(255,255,255,0.06);
    user-select: none;
    -webkit-user-select: none;
  }
  .joy-wedge {
    position: absolute;
    width: 50%;
    height: 50%;
    display: flex;
    cursor: pointer;
  }
  .joy-wedge span {
    display: block;
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--muted);
    transition: color 0.1s ease;
  }
  /* place each wedge's label near the rim in its compass direction */
  .joy-wedge[data-dir="up"]         { top: 0;    left: 25%; justify-content: center; align-items: flex-start; }
  .joy-wedge[data-dir="up-right"]   { top: 0;    left: 50%; justify-content: flex-end; align-items: flex-start; }
  .joy-wedge[data-dir="right"]      { top: 25%;  left: 50%; justify-content: flex-end; align-items: center; }
  .joy-wedge[data-dir="down-right"] { top: 50%;  left: 50%; justify-content: flex-end; align-items: flex-end; }
  .joy-wedge[data-dir="down"]       { top: 50%;  left: 25%; justify-content: center; align-items: flex-end; }
  .joy-wedge[data-dir="down-left"]  { top: 50%;  left: 0;   justify-content: flex-start; align-items: flex-end; }
  .joy-wedge[data-dir="left"]       { top: 25%;  left: 0;   justify-content: flex-start; align-items: center; }
  .joy-wedge[data-dir="up-left"]    { top: 0;    left: 0;   justify-content: flex-start; align-items: flex-start; }
  .joy-wedge span { padding: 10px; }

  .joy-wedge.active span {
    color: var(--accent);
  }

  .joy-center {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 64px;
    height: 64px;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: linear-gradient(145deg, #3a3f47, #22252a);
    box-shadow: 0 4px 10px rgba(0,0,0,0.4), inset 0 1px 2px rgba(255,255,255,0.08);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--accent);
    pointer-events: none;
  }

  .keyboard {
    position: relative;
    display: flex;
    margin: 36px 0 8px;
    height: 160px;
    width: 336px;
  }
  .key {
    position: relative;
    border: 1px solid #0c0d0f;
    border-radius: 0 0 6px 6px;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    padding-bottom: 10px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.03em;
  }
  .key.white {
    position: relative;
    width: 48px;
    height: 160px;
    background: linear-gradient(180deg, #f4f4f4, #e2e2e2);
    color: #666;
    box-shadow: inset 0 -3px 4px rgba(0,0,0,0.08);
    z-index: 1;
  }
  .key.white.active {
    background: linear-gradient(180deg, var(--accent), #4fcfaa);
    color: #10221c;
  }
  .key.black {
    position: absolute;
    top: 0;
    width: 30px;
    height: 98px;
    background: linear-gradient(180deg, #333, #0f0f0f);
    color: #999;
    border-radius: 0 0 4px 4px;
    z-index: 2;
    padding-bottom: 8px;
    font-size: 10px;
  }
  .key.black.active {
    background: linear-gradient(180deg, var(--accent-active), #2aa886);
    color: #062015;
  }
</style>
</head>
<body>
  <div class="synth">
    <h1>Chord</h1>
    <p class="sub">press &amp; hold for tone</p>

    <div class="joystick" id="joystick">
      <div class="joy-wedge" data-dir="up"><span>maj/min</span></div>
      <div class="joy-wedge" data-dir="up-right"><span>dom7</span></div>
      <div class="joy-wedge" data-dir="right"><span>7th</span></div>
      <div class="joy-wedge" data-dir="down-right"><span>9th</span></div>
      <div class="joy-wedge" data-dir="down"><span>sus4</span></div>
      <div class="joy-wedge" data-dir="down-left"><span>6/sus2</span></div>
      <div class="joy-wedge" data-dir="left"><span>darken</span></div>
      <div class="joy-wedge" data-dir="up-left"><span>aug</span></div>
      <div class="joy-center" id="joy-center">maj</div>
    </div>

    <div class="keyboard" id="keyboard"></div>
  </div>

<script>
  const AudioCtx = window.AudioContext || window.webkitAudioContext;
  let audioCtx = null;

  function ensureContext() {
    if (!audioCtx) audioCtx = new AudioCtx();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  }

  const ATTACK = 0.01;
  const RELEASE = 0.08;
  const GAIN = 0.15;

  // active voices, keyed by an arbitrary id (note name or 'btn')
  const voices = new Map();

  function startVoice(id, freq) {
    ensureContext();
    if (voices.has(id)) return;

    const osc = audioCtx.createOscillator();
    const gainNode = audioCtx.createGain();

    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

    gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
    gainNode.gain.linearRampToValueAtTime(GAIN, audioCtx.currentTime + ATTACK);

    osc.connect(gainNode);
    gainNode.connect(audioCtx.destination);
    osc.start();

    voices.set(id, { osc, gainNode });
  }

  function stopVoice(id) {
    const voice = voices.get(id);
    if (!voice) return;
    const { osc, gainNode } = voice;
    const now = audioCtx.currentTime;
    gainNode.gain.cancelScheduledValues(now);
    gainNode.gain.setValueAtTime(gainNode.gain.value, now);
    gainNode.gain.linearRampToValueAtTime(0, now + RELEASE);
    osc.stop(now + RELEASE + 0.02);

    voices.delete(id);
  }

  const FREQ_C4 = 261.63;

  // --- single-octave keyboard: 'a' = middle C (C4), 'w' = C#4 ---
  // Standard piano-style row mapping.
  const NOTE_MAP = [
    { key: 'a', note: 'C4',  semitone: 0,  type: 'white' },
    { key: 'w', note: 'C#4', semitone: 1,  type: 'black' },
    { key: 's', note: 'D4',  semitone: 2,  type: 'white' },
    { key: 'e', note: 'D#4', semitone: 3,  type: 'black' },
    { key: 'd', note: 'E4',  semitone: 4,  type: 'white' },
    { key: 'f', note: 'F4',  semitone: 5,  type: 'white' },
    { key: 't', note: 'F#4', semitone: 6,  type: 'black' },
    { key: 'g', note: 'G4',  semitone: 7,  type: 'white' },
    { key: 'y', note: 'G#4', semitone: 8,  type: 'black' },
    { key: 'h', note: 'A4',  semitone: 9,  type: 'white' },
    { key: 'u', note: 'A#4', semitone: 10, type: 'black' },
    { key: 'j', note: 'B4',  semitone: 11, type: 'white' },
    { key: 'k', note: 'C5',  semitone: 12, type: 'white' },
  ];

  function noteFreq(semitonesFromC4) {
    return FREQ_C4 * Math.pow(2, semitonesFromC4 / 12);
  }

  // Chord voicings in semitones from the root, keyed by joystick direction.
  // Center (no deflection) is a plain major triad. Each direction applies the
  // modification HiChord's default joystick mode documents, from a major base.
  const CHORD_INTERVALS = {
    center:     [0, 4, 7],        // major
    'up':       [0, 3, 7],        // maj/min toggle -> minor (lowered 3rd)
    'up-right': [0, 4, 7, 10],    // dominant 7th (flattened 7th)
    'right':    [0, 4, 7, 11],    // major 7th (natural 7th)
    'down-right': [0, 4, 7, 14],  // add9
    'down':     [0, 5, 7],        // sus4
    'down-left': [0, 4, 7, 9],    // add6
    'left':     [0, 3, 6],        // diminished (darkened)
    'up-left':  [0, 4, 8],        // augmented (raised 5th)
  };
  const CHORD_LABELS = {
    center: 'maj', up: 'min', 'up-right': 'dom7', right: 'maj7',
    'down-right': 'add9', down: 'sus4', 'down-left': 'add6',
    left: 'dim', 'up-left': 'aug',
  };
  let currentChord = 'center';

  const keyByChar = new Map(NOTE_MAP.map(n => [n.key, n]));
  const heldKeys = new Map(); // key -> chord type used when pressed

  // --- render keyboard UI ---
  const keyboardEl = document.getElementById('keyboard');
  const whiteKeys = NOTE_MAP.filter(n => n.type === 'white');
  const blackKeys = NOTE_MAP.filter(n => n.type === 'black');
  const WHITE_KEY_WIDTH = 48;

  whiteKeys.forEach(n => {
    const el = document.createElement('div');
    el.className = 'key white';
    el.dataset.key = n.key;
    el.textContent = n.key;
    keyboardEl.appendChild(el);
    n.el = el;
  });

  // black key horizontal offsets, indexed by which white key they sit between
  const blackOffsetByNote = {
    'C#4': 1, 'D#4': 2, 'F#4': 4, 'G#4': 5, 'A#4': 6,
  };
  blackKeys.forEach(n => {
    const el = document.createElement('div');
    el.className = 'key black';
    el.dataset.key = n.key;
    el.textContent = n.key;
    const whiteIndex = blackOffsetByNote[n.note];
    el.style.left = `${whiteIndex * WHITE_KEY_WIDTH - 15}px`;
    keyboardEl.appendChild(el);
    n.el = el;
  });

  function pressNote(n) {
    if (heldKeys.has(n.key)) return;
    heldKeys.set(n.key, currentChord);
    CHORD_INTERVALS[currentChord].forEach(interval => {
      startVoice(`${n.key}:${interval}`, noteFreq(n.semitone + interval));
    });
    n.el.classList.add('active');
  }

  function releaseNote(n) {
    if (!heldKeys.has(n.key)) return;
    const chord = heldKeys.get(n.key);
    heldKeys.delete(n.key);
    CHORD_INTERVALS[chord].forEach(interval => {
      stopVoice(`${n.key}:${interval}`);
    });
    n.el.classList.remove('active');
  }

  function setChord(chord) {
    if (chord === currentChord) return;
    const previousChord = currentChord;
    currentChord = chord;

    // live-retune any keys currently held: swap out old interval voices for the new chord
    heldKeys.forEach((heldChord, key) => {
      if (heldChord === previousChord) {
        CHORD_INTERVALS[previousChord].forEach(interval => stopVoice(`${key}:${interval}`));
        const n = keyByChar.get(key);
        CHORD_INTERVALS[chord].forEach(interval => {
          startVoice(`${key}:${interval}`, noteFreq(n.semitone + interval));
        });
        heldKeys.set(key, chord);
      }
    });
  }

  // mouse/touch interaction directly on keyboard keys
  NOTE_MAP.forEach(n => {
    n.el.addEventListener('mousedown', () => pressNote(n));
    n.el.addEventListener('mouseup', () => releaseNote(n));
    n.el.addEventListener('mouseleave', () => releaseNote(n));
    n.el.addEventListener('touchstart', (e) => { e.preventDefault(); pressNote(n); }, { passive: false });
    n.el.addEventListener('touchend', (e) => { e.preventDefault(); releaseNote(n); }, { passive: false });
    n.el.addEventListener('touchcancel', (e) => { e.preventDefault(); releaseNote(n); }, { passive: false });
  });

  // physical computer-keyboard interaction
  window.addEventListener('keydown', (e) => {
    if (e.repeat) return;
    const n = keyByChar.get(e.key.toLowerCase());
    if (!n) return;
    pressNote(n);
  });

  window.addEventListener('keyup', (e) => {
    const n = keyByChar.get(e.key.toLowerCase());
    if (!n) return;
    releaseNote(n);
  });

  // --- joystick: hover a wedge to modify the chord; leaving the pad snaps back to major ---
  const joystickEl = document.getElementById('joystick');
  const joyCenterEl = document.getElementById('joy-center');
  const joyWedges = document.querySelectorAll('.joy-wedge');

  function setJoyDirection(dir) {
    setChord(dir);
    joyWedges.forEach(w => w.classList.toggle('active', w.dataset.dir === dir));
    joyCenterEl.textContent = CHORD_LABELS[dir];
  }

  joyWedges.forEach(wedge => {
    wedge.addEventListener('mouseenter', () => setJoyDirection(wedge.dataset.dir));
  });

  joystickEl.addEventListener('mouseleave', () => setJoyDirection('center'));
</script>
</body>
</html>
