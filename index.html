<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chord — Web Synth</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #14161a;
    --panel: #1e2126;
    --accent: #6ee7c9;
    --accent-active: #3fd8ac;
    --text: #e8eaed;
    --muted: #8a8f98;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 50% 20%, #23262c, var(--bg) 70%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--text);
  }
  .synth {
    background: var(--panel);
    border-radius: 24px;
    padding: 40px 48px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.04);
    text-align: center;
  }
  h1 {
    margin: 0 0 4px;
    font-size: 20px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }
  p.sub {
    margin: 0 0 32px;
    color: var(--muted);
    font-size: 13px;
  }
  .joystick {
    width: 220px;
    height: 220px;
    margin: 8px auto 0;
    user-select: none;
    -webkit-user-select: none;
  }
  .joy-wedge {
    cursor: pointer;
    fill: #22252a;
    stroke: #0c0d0f;
    stroke-width: 1;
    transition: fill 0.1s ease;
  }
  .joy-wedge:hover,
  .joy-wedge.active {
    fill: var(--accent-active);
  }
  .joy-label {
    font-size: 8.5px;
    font-weight: 700;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    fill: var(--muted);
    pointer-events: none;
    transition: fill 0.1s ease;
  }
  .joy-wedge:hover + .joy-label,
  .joy-label.active {
    fill: #0d1f19;
  }
  .joy-center {
    fill: url(#centerGradient);
    stroke: rgba(255,255,255,0.08);
    stroke-width: 1;
    pointer-events: none;
  }
  .joy-center-label {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    fill: var(--accent);
    text-anchor: middle;
    dominant-baseline: middle;
    pointer-events: none;
  }

  .keyboard {
    position: relative;
    display: flex;
    margin: 36px 0 8px;
    height: 160px;
    width: 672px;
  }
  .key {
    position: relative;
    border: 1px solid #0c0d0f;
    border-radius: 0 0 6px 6px;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    padding-bottom: 10px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.03em;
  }
  .key.display-only {
    cursor: default;
    opacity: 0.55;
  }
  .key.white {
    position: relative;
    width: 48px;
    height: 160px;
    background: linear-gradient(180deg, #f4f4f4, #e2e2e2);
    color: #666;
    box-shadow: inset 0 -3px 4px rgba(0,0,0,0.08);
    z-index: 1;
  }
  .key.white.active {
    background: linear-gradient(180deg, var(--accent), #4fcfaa);
    color: #10221c;
  }
  .key.white.ghost {
    background: linear-gradient(180deg, #bdeee0, #a6e6d4);
    color: #1c3830;
  }
  .key.black {
    position: absolute;
    top: 0;
    width: 30px;
    height: 98px;
    background: linear-gradient(180deg, #333, #0f0f0f);
    color: #999;
    border-radius: 0 0 4px 4px;
    z-index: 2;
    padding-bottom: 8px;
    font-size: 10px;
  }
  .key.black.active {
    background: linear-gradient(180deg, var(--accent-active), #2aa886);
    color: #062015;
  }
  .key.black.ghost {
    background: linear-gradient(180deg, #2f6656, #1a3a30);
    color: #cdeee2;
  }
</style>
</head>
<body>
  <div class="synth">
    <h1>Chord</h1>
    <p class="sub">press &amp; hold for tone</p>

    <svg class="joystick" id="joystick" viewBox="0 0 220 220">
      <defs>
        <radialGradient id="centerGradient" cx="35%" cy="30%" r="75%">
          <stop offset="0%" stop-color="#3a3f47" />
          <stop offset="100%" stop-color="#22252a" />
        </radialGradient>
      </defs>

      <path class="joy-wedge" data-dir="up" d="M 94.69 73.04 L 71.73 17.61 A 100 100 0 0 1 148.27 17.61 L 125.31 73.04 A 40 40 0 0 0 94.69 73.04 Z" />
      <path class="joy-wedge" data-dir="up-right" d="M 125.31 73.04 L 148.27 17.61 A 100 100 0 0 1 202.39 71.73 L 146.96 94.69 A 40 40 0 0 0 125.31 73.04 Z" />
      <path class="joy-wedge" data-dir="right" d="M 146.96 94.69 L 202.39 71.73 A 100 100 0 0 1 202.39 148.27 L 146.96 125.31 A 40 40 0 0 0 146.96 94.69 Z" />
      <path class="joy-wedge" data-dir="down-right" d="M 146.96 125.31 L 202.39 148.27 A 100 100 0 0 1 148.27 202.39 L 125.31 146.96 A 40 40 0 0 0 146.96 125.31 Z" />
      <path class="joy-wedge" data-dir="down" d="M 125.31 146.96 L 148.27 202.39 A 100 100 0 0 1 71.73 202.39 L 94.69 146.96 A 40 40 0 0 0 125.31 146.96 Z" />
      <path class="joy-wedge" data-dir="down-left" d="M 94.69 146.96 L 71.73 202.39 A 100 100 0 0 1 17.61 148.27 L 73.04 125.31 A 40 40 0 0 0 94.69 146.96 Z" />
      <path class="joy-wedge" data-dir="left" d="M 73.04 125.31 L 17.61 148.27 A 100 100 0 0 1 17.61 71.73 L 73.04 94.69 A 40 40 0 0 0 73.04 125.31 Z" />
      <path class="joy-wedge" data-dir="up-left" d="M 73.04 94.69 L 17.61 71.73 A 100 100 0 0 1 71.73 17.61 L 94.69 73.04 A 40 40 0 0 0 73.04 94.69 Z" />

      <text class="joy-label" data-dir="up" x="110.0" y="32.0" text-anchor="middle">maj/min</text>
      <text class="joy-label" data-dir="up-right" x="165.2" y="54.8" text-anchor="middle">dom7</text>
      <text class="joy-label" data-dir="right" x="188.0" y="110.0" text-anchor="middle">7th</text>
      <text class="joy-label" data-dir="down-right" x="165.2" y="165.2" text-anchor="middle">9th</text>
      <text class="joy-label" data-dir="down" x="110.0" y="188.0" text-anchor="middle">sus4</text>
      <text class="joy-label" data-dir="down-left" x="54.8" y="165.2" text-anchor="middle">6/sus2</text>
      <text class="joy-label" data-dir="left" x="32.0" y="110.0" text-anchor="middle">dark</text>
      <text class="joy-label" data-dir="up-left" x="54.8" y="54.8" text-anchor="middle">aug</text>

      <circle class="joy-center" cx="110" cy="110" r="40" />
      <text class="joy-center-label" id="joy-center" x="110" y="110">maj</text>
    </svg>

    <div class="keyboard" id="keyboard"></div>
  </div>

<script>
  const AudioCtx = window.AudioContext || window.webkitAudioContext;
  let audioCtx = null;

  function ensureContext() {
    if (!audioCtx) audioCtx = new AudioCtx();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  }

  const ATTACK = 0.01;
  const RELEASE = 0.08;
  const GAIN = 0.15;

  // active voices, keyed by an arbitrary id (note name or 'btn')
  const voices = new Map();

  function startVoice(id, freq) {
    ensureContext();
    if (voices.has(id)) return;

    const osc = audioCtx.createOscillator();
    const gainNode = audioCtx.createGain();

    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

    gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
    gainNode.gain.linearRampToValueAtTime(GAIN, audioCtx.currentTime + ATTACK);

    osc.connect(gainNode);
    gainNode.connect(audioCtx.destination);
    osc.start();

    voices.set(id, { osc, gainNode });
  }

  function stopVoice(id) {
    const voice = voices.get(id);
    if (!voice) return;
    const { osc, gainNode } = voice;
    const now = audioCtx.currentTime;
    gainNode.gain.cancelScheduledValues(now);
    gainNode.gain.setValueAtTime(gainNode.gain.value, now);
    gainNode.gain.linearRampToValueAtTime(0, now + RELEASE);
    osc.stop(now + RELEASE + 0.02);

    voices.delete(id);
  }

  const FREQ_C4 = 261.63;

  // --- keyboard display: 2 octaves, C4-C6. Only the lower octave (C4-C5) is
  // interactive (mouse/touch/computer-keyboard); the upper octave is a
  // visual-only display used to show ghost notes for chord tones that fall
  // outside the playable octave (e.g. a 9th, which is +14 semitones). ---
  // 'a' = middle C (C4), 'w' = C#4. Standard piano-style row mapping.
  const OCTAVE_PATTERN = [
    { name: 'C',  semitone: 0,  type: 'white' },
    { name: 'C#', semitone: 1,  type: 'black' },
    { name: 'D',  semitone: 2,  type: 'white' },
    { name: 'D#', semitone: 3,  type: 'black' },
    { name: 'E',  semitone: 4,  type: 'white' },
    { name: 'F',  semitone: 5,  type: 'white' },
    { name: 'F#', semitone: 6,  type: 'black' },
    { name: 'G',  semitone: 7,  type: 'white' },
    { name: 'G#', semitone: 8,  type: 'black' },
    { name: 'A',  semitone: 9,  type: 'white' },
    { name: 'A#', semitone: 10, type: 'black' },
    { name: 'B',  semitone: 11, type: 'white' },
  ];

  // 'a'-'k' plus sharps play C4-C5. Everything above C5 is a visual-only
  // display octave used to show ghost notes for chord tones that fall
  // outside the playable range (e.g. a 9th, which is +14 semitones).
  const LOWER_OCTAVE_KEYS = ['a', 'w', 's', 'e', 'd', 'f', 't', 'g', 'y', 'h', 'u', 'j', 'k'];

  // 25 keys spanning C4-C6 (2 octaves), built from the repeating chromatic pattern.
  const NOTE_MAP = [];
  for (let semitone = 0; semitone <= 24; semitone++) {
    const p = OCTAVE_PATTERN[semitone % 12];
    const octave = 4 + Math.floor(semitone / 12);
    NOTE_MAP.push({
      key: semitone <= 12 ? LOWER_OCTAVE_KEYS[semitone] : null,
      note: `${p.name}${octave}`,
      semitone,
      type: p.type,
      interactive: semitone <= 12,
    });
  }

  function noteFreq(semitonesFromC4) {
    return FREQ_C4 * Math.pow(2, semitonesFromC4 / 12);
  }

  // Chord voicings in semitones from the root, keyed by joystick direction.
  // Center (no deflection) is a plain major triad. Each direction applies the
  // modification HiChord's default joystick mode documents, from a major base.
  const CHORD_INTERVALS = {
    center:     [0, 4, 7],        // major
    'up':       [0, 3, 7],        // maj/min toggle -> minor (lowered 3rd)
    'up-right': [0, 4, 7, 10],    // dominant 7th (flattened 7th)
    'right':    [0, 4, 7, 11],    // major 7th (natural 7th)
    'down-right': [0, 4, 7, 14],  // add9
    'down':     [0, 5, 7],        // sus4
    'down-left': [0, 4, 7, 9],    // add6
    'left':     [0, 3, 6],        // diminished (darkened)
    'up-left':  [0, 4, 8],        // augmented (raised 5th)
  };
  const CHORD_LABELS = {
    center: 'maj', up: 'min', 'up-right': 'dom7', right: 'maj7',
    'down-right': 'add9', down: 'sus4', 'down-left': 'add6',
    left: 'dim', 'up-left': 'aug',
  };
  let currentChord = 'center';

  const keyByChar = new Map(NOTE_MAP.map(n => [n.key, n]));
  const heldKeys = new Map(); // key -> chord type used when pressed

  // --- render keyboard UI ---
  const keyboardEl = document.getElementById('keyboard');
  const whiteKeys = NOTE_MAP.filter(n => n.type === 'white');
  const blackKeys = NOTE_MAP.filter(n => n.type === 'black');
  const WHITE_KEY_WIDTH = 48;

  whiteKeys.forEach((n, i) => {
    const el = document.createElement('div');
    el.className = 'key white' + (n.interactive ? '' : ' display-only');
    if (n.key) el.dataset.key = n.key;
    el.textContent = n.key || '';
    keyboardEl.appendChild(el);
    n.el = el;
    n.whiteIndex = i;
  });

  // black key horizontal offsets, indexed by which white key they sit before
  blackKeys.forEach(n => {
    const el = document.createElement('div');
    el.className = 'key black' + (n.interactive ? '' : ' display-only');
    if (n.key) el.dataset.key = n.key;
    el.textContent = n.key || '';
    // the white key immediately following this black key in NOTE_MAP order
    const followingWhiteIndex = whiteKeys.findIndex(w => w.semitone === n.semitone + 1);
    el.style.left = `${followingWhiteIndex * WHITE_KEY_WIDTH - 15}px`;
    keyboardEl.appendChild(el);
    n.el = el;
  });

  // Recomputes which displayed keys should show the "ghost" highlight: any
  // key (in either octave) whose pitch class matches a currently-sounding
  // chord tone that isn't itself the physically-pressed root.
  function refreshGhostNotes() {
    const soundingClasses = new Set();
    heldKeys.forEach((chord, key) => {
      const n = keyByChar.get(key);
      CHORD_INTERVALS[chord].forEach(interval => {
        if (interval === 0) return; // root is shown via 'active', not ghost
        soundingClasses.add((n.semitone + interval) % 12);
      });
    });

    NOTE_MAP.forEach(n => {
      const isGhost = !n.el.classList.contains('active') && soundingClasses.has(n.semitone % 12);
      n.el.classList.toggle('ghost', isGhost);
    });
  }

  function pressNote(n) {
    if (heldKeys.has(n.key)) return;
    heldKeys.set(n.key, currentChord);
    CHORD_INTERVALS[currentChord].forEach(interval => {
      startVoice(`${n.key}:${interval}`, noteFreq(n.semitone + interval));
    });
    n.el.classList.add('active');
    refreshGhostNotes();
  }

  function releaseNote(n) {
    if (!heldKeys.has(n.key)) return;
    const chord = heldKeys.get(n.key);
    heldKeys.delete(n.key);
    CHORD_INTERVALS[chord].forEach(interval => {
      stopVoice(`${n.key}:${interval}`);
    });
    n.el.classList.remove('active');
    refreshGhostNotes();
  }

  function setChord(chord) {
    if (chord === currentChord) return;
    const previousChord = currentChord;
    currentChord = chord;

    // live-retune any keys currently held: swap out old interval voices for the new chord
    heldKeys.forEach((heldChord, key) => {
      if (heldChord === previousChord) {
        CHORD_INTERVALS[previousChord].forEach(interval => stopVoice(`${key}:${interval}`));
        const n = keyByChar.get(key);
        CHORD_INTERVALS[chord].forEach(interval => {
          startVoice(`${key}:${interval}`, noteFreq(n.semitone + interval));
        });
        heldKeys.set(key, chord);
      }
    });
    refreshGhostNotes();
  }

  // mouse/touch interaction directly on keyboard keys (playable octave only;
  // the upper display octave is visual-only and shows ghost notes)
  NOTE_MAP.filter(n => n.interactive).forEach(n => {
    n.el.addEventListener('mousedown', () => pressNote(n));
    n.el.addEventListener('mouseup', () => releaseNote(n));
    n.el.addEventListener('mouseleave', () => releaseNote(n));
    n.el.addEventListener('touchstart', (e) => { e.preventDefault(); pressNote(n); }, { passive: false });
    n.el.addEventListener('touchend', (e) => { e.preventDefault(); releaseNote(n); }, { passive: false });
    n.el.addEventListener('touchcancel', (e) => { e.preventDefault(); releaseNote(n); }, { passive: false });
  });

  // physical computer-keyboard interaction
  window.addEventListener('keydown', (e) => {
    if (e.repeat) return;
    const n = keyByChar.get(e.key.toLowerCase());
    if (!n) return;
    pressNote(n);
  });

  window.addEventListener('keyup', (e) => {
    const n = keyByChar.get(e.key.toLowerCase());
    if (!n) return;
    releaseNote(n);
  });

  // --- joystick: hover a wedge to modify the chord; leaving the pad snaps back to major ---
  const joystickEl = document.getElementById('joystick');
  const joyCenterEl = document.getElementById('joy-center');
  const joyWedges = document.querySelectorAll('.joy-wedge');
  const joyLabels = document.querySelectorAll('.joy-label');

  function setJoyDirection(dir) {
    setChord(dir);
    joyWedges.forEach(w => w.classList.toggle('active', w.dataset.dir === dir));
    joyLabels.forEach(l => l.classList.toggle('active', l.dataset.dir === dir));
    joyCenterEl.textContent = CHORD_LABELS[dir];
  }

  joyWedges.forEach(wedge => {
    wedge.addEventListener('mouseenter', () => setJoyDirection(wedge.dataset.dir));
  });

  joystickEl.addEventListener('mouseleave', () => setJoyDirection('center'));
</script>
</body>
</html>
