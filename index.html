<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JoyChord — Web Synth</title>
<meta name="theme-color" content="#14161a">
<meta name="description" content="JoyChord — a HiChord-inspired dual-joystick chord synthesizer for the browser.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="JoyChord">
<meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="fx-toggles">
    <button class="fx-toggle" id="delay-toggle" type="button" aria-pressed="true">Delay</button>
    <button class="fx-toggle" id="reverb-toggle" type="button" aria-pressed="true">Reverb</button>
  </div>

  <button class="fullscreen-btn" id="fullscreen-btn" aria-label="Toggle fullscreen" type="button">
    <svg id="fullscreen-icon-expand" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3" />
    </svg>
    <svg id="fullscreen-icon-collapse" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
      <path d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 1 2-2h3M3 16h3a2 2 0 0 1 2 2v3" />
    </svg>
  </button>

  <div class="build-version">v24</div>
  <button class="debug-toggle" id="debug-toggle" type="button">debug</button>
  <div class="debug-panel" id="debug-panel"></div>

  <div class="synth">
    <div class="joysticks">
      <svg class="joystick" id="degree-joystick" viewBox="0 0 220 220">
        <defs>
          <radialGradient id="degreeCenterGradient" cx="35%" cy="30%" r="75%">
            <stop offset="0%" stop-color="#3a3f47" />
            <stop offset="100%" stop-color="#22252a" />
          </radialGradient>
        </defs>
      </svg>

      <select class="key-select" id="key-select"></select>
      <select class="key-select wave-select" id="wave-select"></select>

      <svg class="joystick" id="joystick" viewBox="0 0 220 220">
        <defs>
          <radialGradient id="centerGradient" cx="35%" cy="30%" r="75%">
            <stop offset="0%" stop-color="#3a3f47" />
            <stop offset="100%" stop-color="#22252a" />
          </radialGradient>
        </defs>

        <path class="joy-wedge" data-dir="up" d="M 94.69 73.04 L 71.73 17.61 A 100 100 0 0 1 148.27 17.61 L 125.31 73.04 A 40 40 0 0 0 94.69 73.04 Z" />
        <path class="joy-wedge" data-dir="up-right" d="M 125.31 73.04 L 148.27 17.61 A 100 100 0 0 1 202.39 71.73 L 146.96 94.69 A 40 40 0 0 0 125.31 73.04 Z" />
        <path class="joy-wedge" data-dir="right" d="M 146.96 94.69 L 202.39 71.73 A 100 100 0 0 1 202.39 148.27 L 146.96 125.31 A 40 40 0 0 0 146.96 94.69 Z" />
        <path class="joy-wedge" data-dir="down-right" d="M 146.96 125.31 L 202.39 148.27 A 100 100 0 0 1 148.27 202.39 L 125.31 146.96 A 40 40 0 0 0 146.96 125.31 Z" />
        <path class="joy-wedge" data-dir="down" d="M 125.31 146.96 L 148.27 202.39 A 100 100 0 0 1 71.73 202.39 L 94.69 146.96 A 40 40 0 0 0 125.31 146.96 Z" />
        <path class="joy-wedge" data-dir="down-left" d="M 94.69 146.96 L 71.73 202.39 A 100 100 0 0 1 17.61 148.27 L 73.04 125.31 A 40 40 0 0 0 94.69 146.96 Z" />
        <path class="joy-wedge" data-dir="left" d="M 73.04 125.31 L 17.61 148.27 A 100 100 0 0 1 17.61 71.73 L 73.04 94.69 A 40 40 0 0 0 73.04 125.31 Z" />
        <path class="joy-wedge" data-dir="up-left" d="M 73.04 94.69 L 17.61 71.73 A 100 100 0 0 1 71.73 17.61 L 94.69 73.04 A 40 40 0 0 0 73.04 94.69 Z" />

        <text class="joy-label" data-dir="up" id="joy-label-up" x="110.0" y="32.0" text-anchor="middle">Maj/Min</text>
        <text class="joy-label" data-dir="up-right" x="165.2" y="54.8" text-anchor="middle">Dom7</text>
        <text class="joy-label" data-dir="right" id="joy-label-right" x="188.0" y="110.0" text-anchor="middle">Maj7/min7</text>
        <text class="joy-label" data-dir="down-right" x="165.2" y="165.2" text-anchor="middle">9th</text>
        <text class="joy-label" data-dir="down" x="110.0" y="188.0" text-anchor="middle">Sus4</text>
        <text class="joy-label" data-dir="down-left" id="joy-label-down-left" x="54.8" y="165.2" text-anchor="middle">6th/Sus2</text>
        <text class="joy-label" data-dir="left" id="joy-label-left" x="32.0" y="110.0" text-anchor="middle">Dim/Min</text>
        <text class="joy-label" data-dir="up-left" x="54.8" y="54.8" text-anchor="middle">Aug</text>

        <circle class="joy-center" cx="110" cy="110" r="40" />
        <text class="joy-center-label" id="joy-center" x="110" y="110"></text>
        <circle class="stick-dot" id="joy-stick-dot" cx="110" cy="110" r="14" />
      </svg>
    </div>
  </div>

<script type="module" src="src/index.js"></script>
</body>
</html>
