<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chord — Web Synth</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #14161a;
    --panel: #1e2126;
    --accent: #6ee7c9;
    --accent-active: #3fd8ac;
    --text: #e8eaed;
    --muted: #8a8f98;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 50% 20%, #23262c, var(--bg) 70%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--text);
  }
  .synth {
    background: var(--panel);
    border-radius: 24px;
    padding: 40px 48px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.04);
    text-align: center;
  }
  h1 {
    margin: 0 0 4px;
    font-size: 20px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }
  p.sub {
    margin: 0 0 32px;
    color: var(--muted);
    font-size: 13px;
  }
  #tone-btn {
    width: 160px;
    height: 160px;
    border-radius: 50%;
    border: none;
    background: linear-gradient(145deg, #2a2e35, #1a1c20);
    box-shadow: 0 8px 20px rgba(0,0,0,0.4), inset 0 1px 2px rgba(255,255,255,0.06);
    color: var(--accent);
    font-size: 16px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    cursor: pointer;
    transition: transform 0.06s ease, box-shadow 0.06s ease, color 0.06s ease;
    user-select: none;
    -webkit-user-select: none;
  }
  #tone-btn:hover {
    color: var(--accent-active);
  }
  #tone-btn:active,
  #tone-btn.active {
    transform: scale(0.96);
    box-shadow: 0 4px 10px rgba(0,0,0,0.4), inset 0 2px 4px rgba(0,0,0,0.5), 0 0 24px rgba(110,231,201,0.35);
  }
</style>
</head>
<body>
  <div class="synth">
    <h1>Chord</h1>
    <p class="sub">press &amp; hold for tone</p>
    <button id="tone-btn">Play</button>
  </div>

<script>
  const AudioCtx = window.AudioContext || window.webkitAudioContext;
  let audioCtx = null;
  let osc = null;
  let gainNode = null;

  const FREQ = 261.63; // C4
  const ATTACK = 0.01;
  const RELEASE = 0.08;

  function ensureContext() {
    if (!audioCtx) audioCtx = new AudioCtx();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  }

  function startTone() {
    ensureContext();
    if (osc) return; // already playing

    osc = audioCtx.createOscillator();
    gainNode = audioCtx.createGain();

    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(FREQ, audioCtx.currentTime);

    gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
    gainNode.gain.linearRampToValueAtTime(0.3, audioCtx.currentTime + ATTACK);

    osc.connect(gainNode);
    gainNode.connect(audioCtx.destination);
    osc.start();

    btn.classList.add('active');
  }

  function stopTone() {
    if (!osc) return;
    const now = audioCtx.currentTime;
    gainNode.gain.cancelScheduledValues(now);
    gainNode.gain.setValueAtTime(gainNode.gain.value, now);
    gainNode.gain.linearRampToValueAtTime(0, now + RELEASE);

    const oscToStop = osc;
    oscToStop.stop(now + RELEASE + 0.02);
    osc = null;
    gainNode = null;

    btn.classList.remove('active');
  }

  const btn = document.getElementById('tone-btn');

  btn.addEventListener('mousedown', startTone);
  btn.addEventListener('mouseup', stopTone);
  btn.addEventListener('mouseleave', stopTone);

  btn.addEventListener('touchstart', (e) => { e.preventDefault(); startTone(); }, { passive: false });
  btn.addEventListener('touchend', (e) => { e.preventDefault(); stopTone(); }, { passive: false });
  btn.addEventListener('touchcancel', (e) => { e.preventDefault(); stopTone(); }, { passive: false });
</script>
</body>
</html>
